[workspace]
resolver = "2"
members = ["crates/asis-core", "crates/asis", "crates/asis-gui"]

[profile.release]
# 画面は CPU で描くので、大きさより速さを取る("z" だとスクロールの描き直しが 4 割 遅い)
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# 重さを調べるとき用(`cargo build --profile profiling`)。速さは release と同じで、関数の名前を残す
[profile.profiling]
inherits = "release"
strip = false
debug = 1

# CPU で描く部品(iced の tiny-skia)を、直したものに差し替える。何を直したかは vendor/iced_tiny_skia/PATCHES.md
[patch.crates-io]
iced_tiny_skia = { path = "vendor/iced_tiny_skia" }
