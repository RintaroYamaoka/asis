[package]
name = "asis"
version = "0.1.0"
edition = "2021"
description = "development, as is"
license = "MIT"

[dependencies]
asis-core = { path = "../asis-core" }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde"] }
unicode-width = "0.2.3"
ureq = "3.5.2"
sha2 = "0.11.1"
getrandom = "0.4.3"
